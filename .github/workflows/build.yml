name: build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy -p binary --no-default-features -- -D warnings

      - name: Docs
        run: cargo doc -p binary --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt
          bash scripts/check-shell.sh

  test:
    # The instrumented run doubles as the std + derive test run: llvm-cov
    # executes the same suite, so a separate 'cargo test --all' would only
    # repeat it. Only the upload is allowed to fail, which keeps a flaky
    # Coveralls from turning a green build red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Test and coverage (std + derive)
        run: bash scripts/run-coverage.sh

      - name: Test (no_std + alloc)
        run: cargo test -p binary --no-default-features

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false
          file: target/coverage/lcov.info

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"

      - uses: Swatinem/rust-cache@v2

      - name: Check against the declared MSRV
        run: cargo check --workspace

  cross:
    # The native x86-64 run happens in `test`, so this job takes the other three
    # widths and endiannesses: 64-bit little endian (aarch64), 32-bit little
    # endian (armv7) and 64-bit big endian (s390x).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is the name scripts/test-multiarch.sh knows, `arch` is the
          # Debian name that names the libc6-dev-<arch>-cross sysroot package.
          - target: aarch64
            arch: arm64
            packages: gcc-aarch64-linux-gnu
          - target: armv7
            arch: armhf
            packages: gcc-arm-linux-gnueabihf
          - target: s390x
            arch: s390x
            packages: gcc-s390x-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the cross toolchain and qemu
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user $PACKAGES "libc6-dev-$ARCH-cross"

      - name: Test ${{ matrix.target }}
        run: bash scripts/test-multiarch.sh ${{ matrix.target }}

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Miri (host + big-endian abstract machine)
        run: bash scripts/check-miri.sh
